name: Test and deploy Render

on:
  push:
    branches: [master]
  # Pull requests get the same checks (the `test` job) but never deploy: the
  # `deploy` job below only runs for master.
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_authorized:
        description: Explicitly request deployment after protected production approval
        type: boolean
        default: false
      deploy_sha:
        description: Exact current master commit SHA to deploy
        type: string
        required: false

# The checks only read the repository; nothing here needs to write to it.
permissions:
  contents: read

# One run per branch at a time. A newer push to a pull request supersedes the
# older, now-pointless run; runs on master are never cancelled, so a deploy
# in flight is not interrupted (the same behaviour as before).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # the online suite's database tests (concurrency, the lobby, seats, the
    # inbox) skip without one — which here meant they never ran at all
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui-source/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ui-source
      - run: npm run typecheck
      - run: npm run online:typecheck
      - run: npm --prefix ui-source run build
      - run: npm test
      - run: npm --prefix ui-source run test
      # the league server runs the client's rules; its suite is what catches
      # a change that works in the dynasty and breaks the online league
      - run: npm run online:test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Verify deployment authorization guards
        run: node --test test/agent-loop/deployment.test.mjs

  deploy:
    needs: test
    # A merge/push runs CI only. Deployment requires a separate explicit request.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.deploy_authorized == true
    environment: production
    permissions:
      contents: read
      deployments: read
      actions: read
    # Deploys queue one after another, whichever run they came from.
    concurrency:
      group: production-render
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      UI_DEPLOY_HOOK: ${{ secrets.RENDER_UI_DEPLOY_HOOK }}
      API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      DEPLOY_UI_URL: ${{ vars.DEPLOY_UI_URL }}
      DEPLOY_API_URL: ${{ vars.DEPLOY_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Verify explicit SHA and protected production approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_REQUESTED_SHA: ${{ inputs.deploy_sha }}
          DEPLOY_AUTHORIZED: ${{ inputs.deploy_authorized }}
        run: node scripts/authorize-render-deploy.mjs
      - name: Require deployment configuration
        run: |
          test -n "$UI_DEPLOY_HOOK" || { echo "Missing RENDER_UI_DEPLOY_HOOK secret"; exit 1; }
          test -n "$API_DEPLOY_HOOK" || { echo "Missing RENDER_API_DEPLOY_HOOK secret"; exit 1; }
          test -n "$DEPLOY_UI_URL" || { echo "Missing DEPLOY_UI_URL repository variable"; exit 1; }
          test -n "$DEPLOY_API_URL" || { echo "Missing DEPLOY_API_URL repository variable"; exit 1; }
      - name: Deploy this exact commit to both Render services
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/trigger-render-deploys.mjs
      - name: Verify both services are serving this commit
        env:
          DEPLOY_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-deployment.mjs --wait-seconds 900
