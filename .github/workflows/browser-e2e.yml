name: Browser E2E (advisory)

on:
  pull_request:
    paths:
      - '.github/workflows/browser-e2e.yml'
      - 'e2e/**'
      - 'ui-source/**'
      - 'src/**'
      - '.claude/skills/wentz-verify/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Chromium browser tests (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      E2E_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui-source/package-lock.json
      - name: Install locked root dependencies
        run: npm ci
      - name: Install locked UI dependencies
        run: npm ci --prefix ui-source
      - name: Install Playwright Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Typecheck browser tests and fixtures
        run: npm run e2e:typecheck
      - name: Run complete browser suite
        run: npm run e2e
      - name: Upload browser results and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/test-results/
            test-results/
            e2e/playwright-report/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
